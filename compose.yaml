# Optional localhost services. The application control plane currently uses SQLite.
services:
  postgres:
    image: docker.io/library/postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexora}
      POSTGRES_DB: ${POSTGRES_DB:-nexora}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - "postgres:/var/lib/postgresql:Z"
      - "./.secrets/postgres_password:/run/secrets/postgres_password:ro,Z"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      retries: 5
    mem_limit: 512m
  redis:
    image: docker.io/library/redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis:/data:Z"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
    mem_limit: 256m
volumes:
  postgres: {}
  redis: {}
