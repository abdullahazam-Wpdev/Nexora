[project]
name = "nexora-ai-os"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = ["fastapi", "uvicorn", "torch", "tokenizers", "safetensors", "psutil", "numpy"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[project.optional-dependencies]
dev = ["pytest", "httpx", "playwright", "ruff", "pip-audit", "podman-compose"]

speech = ["nvidia-riva-client==2.27.0", "grpcio==1.84.0", "grpcio-tools==1.81.1", "protobuf==6.33.5", "websockets==15.0.1"]
